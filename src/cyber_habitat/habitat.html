<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mori · Cyber Habitat</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6 }
  body { max-width: 880px; margin: 40px auto; padding: 0 20px }
  h1 { margin-bottom: 4px } .muted { color: #aab4c4 } .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
  input, button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #53627a }
  input { background: #1f2937; color: white } button { background: #2563eb; color: white; cursor: pointer }
  button:disabled { opacity: .5; cursor: wait } section { margin: 28px 0 } .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px }
  article { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 16px }
  article h3 { margin-top: 0 } .stat { margin: 7px 0 } .actions button { margin: 5px 5px 0 0; padding: 7px 10px }
  li { margin: 8px 0 } #message { min-height: 24px; color: #93c5fd }
  #chatLog { min-height: 80px; max-height: 280px; overflow: auto; background: #1f2937; border-radius: 8px; padding: 12px }
  #chatLog p { margin: 7px 0 } #chatMessage { flex: 1; min-width: 220px }
  :root { color-scheme: dark; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #06121f; color: #eff8ff }
  * { box-sizing: border-box }
  body { max-width: 1040px; margin: auto; padding: 22px 22px 72px; background: radial-gradient(circle at 50% 4%, #173d59 0, #0a2438 33%, #06121f 72%) }
  h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); letter-spacing: .02em }
  h2 { margin: 0 0 14px; font-size: 18px }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px }
  .topbar p { margin: 5px 0 0; font-size: 13px }
  .eyebrow { color: #8dd8ec; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800 }
  .connection { color: #b7d5e3; font-size: 12px; padding: 8px 12px; background: #12344b; border: 1px solid #2a5972; border-radius: 999px }
  .home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(290px, .85fr); gap: 20px; align-items: stretch }
  .stage { position: relative; min-height: 505px; overflow: hidden; border-radius: 30px; border: 1px solid #4c8ba4; background: radial-gradient(circle at 50% 32%, #4c9fc0 0, #21617e 36%, #102f49 74%, #092338 100%); box-shadow: 0 24px 70px #020b16aa, inset 0 1px 0 #c5f6ff66 }
  .stage::before { content: ""; position: absolute; width: 400px; height: 400px; border: 1px solid #d4f9ff36; border-radius: 50%; left: 50%; top: 42%; transform: translate(-50%,-50%); box-shadow: 0 0 0 50px #d4f9ff10, 0 0 0 112px #d4f9ff08 }
  .stage::after { content: ""; position: absolute; inset: auto 0 0; height: 110px; background: linear-gradient(transparent, #071d32b8); pointer-events: none }
  .stage-top { position: absolute; top: 20px; left: 22px; right: 22px; z-index: 2; display: flex; justify-content: space-between; align-items: start; gap: 12px }
  .stage-top strong { font-size: 22px }
  .stage-top p { margin: 4px 0; font-size: 12px; color: #d6f0f5 }
  .stage-tag { border-radius: 999px; background: #e8fbff25; padding: 6px 10px; color: #e5faff; font-size: 12px }
  .pet-button { position: absolute; top: 47%; left: 50%; transform: translate(-50%,-50%); width: min(74%, 370px); border: 0; padding: 0; background: transparent; filter: drop-shadow(0 30px 24px #061b3277); z-index: 1; cursor: pointer }
  .pet-button:focus-visible { outline: 3px solid #d5f9ff; border-radius: 35% }
  .pet-body { width: 100%; overflow: visible; animation: float 4s ease-in-out infinite }
  .pet-tail { transform-origin: 250px 166px; animation: tail 2.4s ease-in-out infinite }
  .pet-fin { transform-origin: 135px 190px; animation: fin 3s ease-in-out infinite }
  .pet-eye { transform-origin: center; animation: blink 6s infinite }
  .pet-button[data-state="thinking"] .pet-body { animation-duration: 1.4s }
  .pet-button[data-state="speaking"] .pet-body { animation-duration: .7s }
  .pet-button[data-state="listening"] { filter: drop-shadow(0 20px 30px #aff5ff) }
  .pet-button[data-state="sleepy"] .pet-body { animation-duration: 6s }
  .pet-button[data-state="greeting"] .pet-fin { animation-duration: .45s }
  @keyframes float { 50% { transform: translateY(-12px) rotate(1.5deg) } }
  @keyframes tail { 50% { transform: rotate(11deg) } }
  @keyframes fin { 50% { transform: rotate(-14deg) } }
  @keyframes blink { 0%, 45%, 47%, 100% { transform: scaleY(1) } 46% { transform: scaleY(.08) } }
  .stage-bottom { position: absolute; z-index: 3; left: 20px; right: 20px; bottom: 18px }
  .pet-caption { background: #eafaff; color: #12364a; padding: 12px 16px; border-radius: 18px 18px 18px 4px; max-width: 440px; box-shadow: 0 12px 26px #041b2d55; font-size: 14px; line-height: 1.5 }
  .pet-caption small { display: block; color: #507083; font-size: 11px; font-weight: 700; margin-bottom: 3px }
  #petCaption { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden }
  .stage-hint { color: #cdebf3; font-size: 11px; margin: 9px 0 0 5px }
  .companion-panel { display: flex; flex-direction: column; gap: 14px }
  .companion-panel section { margin: 0 }
  .surface { background: #10283bdb; border: 1px solid #2a5167; border-radius: 24px; padding: 18px; box-shadow: 0 12px 32px #02101c50 }
  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px }
  .status-grid span { display: block; background: #1a3c52; border-radius: 14px; padding: 10px; font-size: 11px; color: #add0df }
  .status-grid strong { display: block; color: #f3fcff; font-size: 20px; margin-top: 4px }
  #chatLog { min-height: 180px; max-height: 300px; background: transparent; padding: 0; display: flex; flex-direction: column; gap: 9px }
  #chatLog p { margin: 0; max-width: 88%; padding: 10px 13px; line-height: 1.5; border-radius: 16px; background: #1c4055; overflow-wrap: anywhere }
  #chatLog p.mine { background: #2784a4; align-self: flex-end }
  #chatLog p.theirs { align-self: flex-start }
  #chatMessage { min-width: 0; width: 100%; border-radius: 14px; background: #1d3c50; border-color: #436b7d }
  #send { background: #a5ecf5; color: #0b3546; border: 0; font-weight: 800 }
  .chat-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px }
  .chat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px }
  .chat-head select { color: #d9f5ff; background: #1b3c51; border: 1px solid #4d7387; padding: 7px; border-radius: 10px }
  .extras { margin-top: 26px }
  .extras details { background: #0f293c; border: 1px solid #284f62; border-radius: 18px; margin: 10px 0; padding: 0 16px }
  .extras summary { padding: 16px 0; cursor: pointer; font-weight: 700 }
  .extras section { margin: 0 0 16px }
  .extras article { background: #19384a }
  .extras input { max-width: 100% }
  .extras button { background: #245978; border-color: #4f8399 }
  #message { margin: 12px 4px; font-size: 13px }
  @media (max-width: 760px) { body { padding: 16px 13px 48px } .home { grid-template-columns: 1fr; gap: 12px } .stage { min-height: 400px; border-radius: 24px } .pet-button { width: min(76%, 310px); top: 49% } .companion-panel { gap: 12px } .companion-panel .surface:first-child { order: 2 } .companion-panel .surface:last-child { order: 1 } .topbar { align-items: start } .connection { max-width: 135px; text-align: center } }
  @media (prefers-reduced-motion: reduce) { .pet-body, .pet-tail, .pet-fin, .pet-eye { animation: none !important } }
</style>
<header class="topbar"><div><div class="eyebrow">CYBER HABITAT · 海湾</div><h1>Mori 的小世界</h1><p class="muted">来看看她，或坐下聊一会儿。</p></div><span id="aiStatus" class="connection">正在检查连接…</span></header>
<main class="home">
  <div class="stage"><div class="stage-top"><div><strong id="petName">Mori</strong><p id="petActivity">在这里陪着你</p></div><span class="stage-tag" id="petMood">安静待着</span></div>
    <button class="pet-button" id="petButton" type="button" data-state="idle" aria-label="轻触 Mori 打招呼"><svg class="pet-body" viewBox="0 0 400 330" role="img" aria-label="原创蓝色小鲸鱼"><defs><linearGradient id="whaleBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ce7ed"/><stop offset=".55" stop-color="#48b6d2"/><stop offset="1" stop-color="#287aaf"/></linearGradient><linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbffff"/><stop offset="1" stop-color="#a9e5ef"/></linearGradient></defs><ellipse cx="204" cy="292" rx="121" ry="15" fill="#072840" opacity=".28"/><g class="pet-tail"><path d="M268 153 Q323 106 350 84 Q348 128 326 150 Q361 150 379 128 Q377 177 333 192 Q302 186 266 177Z" fill="#4cbbd4" stroke="#287eab" stroke-width="5"/></g><path d="M105 99 Q104 43 127 42 Q141 64 133 104" fill="#5cc8dc" stroke="#2a8db3" stroke-width="4"/><path d="M235 90 Q246 42 267 53 Q267 78 254 113" fill="#5cc8dc" stroke="#2a8db3" stroke-width="4"/><ellipse cx="191" cy="167" rx="120" ry="99" fill="url(#whaleBlue)" stroke="#237fa8" stroke-width="5"/><path d="M91 185 Q149 245 268 203 Q262 254 199 265 Q118 265 91 185" fill="url(#belly)" opacity=".98"/><g class="pet-fin"><path d="M117 185 Q57 177 39 211 Q69 238 123 220" fill="#58c3d7" stroke="#287eaa" stroke-width="5"/></g><path d="M265 183 Q302 182 314 211 Q289 228 260 216" fill="#399dbd" stroke="#287eaa" stroke-width="5"/><ellipse class="pet-eye" cx="157" cy="150" rx="8" ry="11" fill="#173c5a"/><ellipse class="pet-eye" cx="231" cy="150" rx="8" ry="11" fill="#173c5a"/><path d="M178 184 Q192 196 207 183" fill="none" stroke="#235874" stroke-width="5" stroke-linecap="round"/><ellipse cx="118" cy="179" rx="20" ry="10" fill="#f8afbd" opacity=".5"/><ellipse cx="258" cy="177" rx="19" ry="10" fill="#f8afbd" opacity=".5"/><path d="M183 75 Q180 54 190 45 Q197 63 199 76" fill="#7cdeea" stroke="#287eaa" stroke-width="4"/></svg></button>
    <div class="stage-bottom"><div class="pet-caption"><small id="petCaptionLabel">最近的话</small><span id="petCaption">等你来聊聊。</span></div><p class="stage-hint">轻触她打招呼 · 她会在这里等你</p></div>
  </div>
  <div class="companion-panel"><section class="surface"><div class="eyebrow">最近状态</div><h2 id="petSummary">安静地待着</h2><div class="status-grid"><span>精力<strong id="petEnergy">—</strong></span><span>安全<strong id="petSafety">—</strong></span><span>成长<strong id="petGrowth">—</strong></span></div></section>
    <section class="surface"><div class="chat-head"><h2>和她说话</h2><select id="chatResident" aria-label="选择居民"></select></div><div id="chatLog" aria-live="polite"></div><div class="chat-input"><input id="chatMessage" maxlength="1000" placeholder="想和 Mori 说什么？" aria-label="聊天消息"><button id="send" disabled>发送</button></div></section></div>
</main>
<p id="message" role="status"></p>
<div class="extras"><div class="eyebrow">更多设置</div>
<details><summary>模型连接</summary><section><div class="row"><input id="apiKey" type="password" autocomplete="off" placeholder="在本机输入 DeepSeek API Key" aria-label="DeepSeek API Key"><label><input id="rememberKey" type="checkbox" checked> 保存到本机配置</label><button id="connect">连接 DeepSeek</button><button id="disconnect">本次断开</button><button id="forgetKey">删除本机保存的密钥</button></div><p class="muted">保存后密钥以明文写入本项目已忽略的 <code>.env</code>；发送消息时，相关内容会发给 DeepSeek。</p></section></details>
<details><summary>世界与居民</summary><section><div class="row"><input id="name" value="Mori" maxlength="80" aria-label="角色名字"><button id="create">让角色进场</button><button id="tick">规则推进一天</button><button id="aiTick" disabled>AI 推进一天</button><button id="refresh">刷新世界</button></div><div id="residents" class="cards"></div></section></details>
<details><summary>自主生活（可选）</summary><section><p class="muted">默认暂停。开启后居民会定时自己决定动作；服务重启时自动暂停。</p><div class="row"><label>间隔（分钟） <input id="intervalMinutes" type="number" min="1" max="1440" value="30" style="width:75px"></label><label>每天最多 <input id="dailyLimit" type="number" min="1" max="48" value="24" style="width:65px"></label><button id="startLife" disabled>开启自主生活</button><button id="stopLife">暂停</button></div><p id="lifeStatus" class="muted">正在读取状态…</p></section></details>
<details><summary>世界记录</summary><section><ol id="events"></ol></section></details></div>
<script>
const $ = id => document.getElementById(id);
const labels = {'resident.created':'进入世界','action.applied':'完成动作','action.blocked':'动作被阻止','world.discovery':'发现','world.weather':'天气','world.visitor':'访客','world.tick':'规则回合结束','world.ai_tick':'AI 回合结束','ai.proposal.rejected':'AI 提议被拒绝','resident.spoke':'说话'};
const actions = {rest:'休息',learn:'学习',socialize:'社交',explore:'探索',create:'创作',attack:'攻击'};
let aiConfigured = false;
let petStateTimer;
function setPetState(state, duration = 0) {
  clearTimeout(petStateTimer);
  $('petButton').dataset.state = state;
  if (duration) petStateTimer = setTimeout(() => { $('petButton').dataset.state = 'idle'; }, duration);
}
function setCaption(label, content) {
  $('petCaptionLabel').textContent = label;
  $('petCaption').textContent = content;
}
function renderCompanion(resident) {
  if (!resident) {
    $('petName').textContent = 'Mori';
    $('petActivity').textContent = '等待第一次相遇';
    $('petMood').textContent = '还未进场';
    $('petSummary').textContent = '让 Mori 来到这里';
    for (const key of ['petEnergy', 'petSafety', 'petGrowth']) $(key).textContent = '—';
    setCaption('这里会出现她真正说过的话', '还没有居民。展开“世界与居民”，让 Mori 进场。');
    return;
  }
  $('petName').textContent = resident.name;
  $('petActivity').textContent = resident.intention ? `上次想做：${resident.intention}` : '最近没有安排';
  $('petEnergy').textContent = resident.energy;
  $('petSafety').textContent = resident.safety;
  $('petGrowth').textContent = resident.growth;
  const mood = resident.energy < 30 ? '精力偏低' : resident.safety < 30 ? '安全偏低' : '状态平稳';
  $('petMood').textContent = mood;
  $('petSummary').textContent = resident.intention ? `上次想做：${resident.intention}` : mood;
  if ($('petButton').dataset.state === 'idle' || $('petButton').dataset.state === 'sleepy') setPetState(resident.energy < 30 ? 'sleepy' : 'idle');
}
async function api(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
  return data;
}
async function refresh() {
  const [people, history] = await Promise.all([api('/residents'), api('/events?limit=30')]);
  const selector = $('chatResident'); const selected = selector.value; selector.replaceChildren();
  for (const resident of people.residents) { const option = document.createElement('option'); option.value = resident.id; option.textContent = resident.name; selector.append(option); }
  if (people.residents.some(r => r.id === selected)) selector.value = selected;
  renderCompanion(people.residents.find(r => r.id === selector.value));
  $('send').disabled = !aiConfigured || !selector.value;
  const cards = $('residents'); cards.replaceChildren();
  if (!people.residents.length) cards.textContent = '还没有居民。点击“让角色进场”。';
  for (const resident of people.residents) {
    const card = document.createElement('article');
    const title = document.createElement('h3'); title.textContent = resident.name; card.append(title);
    if (resident.intention) { const intention = document.createElement('p'); intention.className = 'muted'; intention.textContent = `现在想做：${resident.intention}`; card.append(intention); }
    for (const [label, key] of [['精力','energy'],['安全','safety'],['成长','growth']]) {
      const stat = document.createElement('div'); stat.className = 'stat'; stat.textContent = `${label}：${resident[key]}`; card.append(stat);
    }
    const actions = document.createElement('div'); actions.className = 'actions';
    for (const [label, kind] of [['休息','rest'],['学习','learn'],['社交','socialize'],['探索','explore'],['创作','create']]) {
      const button = document.createElement('button'); button.textContent = label;
      button.onclick = () => act(resident.id, kind); actions.append(button);
    }
    card.append(actions); cards.append(card);
  }
  const list = $('events'); list.replaceChildren();
  for (const event of history.events.reverse()) {
    const item = document.createElement('li');
    const detail = event.payload.description || event.payload.intention || (event.payload.action ? `${actions[event.payload.action] || event.payload.action}${event.payload.detail ? ' · ' + event.payload.detail : ''}` : '') || event.payload.name || event.payload.message || '';
    item.textContent = `${labels[event.type] || event.type} · ${event.subject}${detail ? ' · ' + detail : ''}`;
    list.append(item);
  }
  if (!history.events.length) list.textContent = '暂无事件。';
  await loadConversation();
}
async function loadConversation() {
  const log = $('chatLog'); log.replaceChildren();
  if (!$('chatResident').value) { log.textContent = '先让角色进场。'; return; }
  const data = await api(`/residents/${encodeURIComponent($('chatResident').value)}/conversation`);
  for (const entry of data.messages) { const line = document.createElement('p'); line.className = entry.role === 'user' ? 'mine' : 'theirs'; line.textContent = entry.content; log.append(line); }
  if (!data.messages.length) log.textContent = '还没有对话。';
  const lastReply = [...data.messages].reverse().find(entry => entry.role === 'assistant');
  if (lastReply) setCaption('上次她说', lastReply.content);
  else setCaption('最近的话', '等你来聊聊。');
  log.scrollTop = log.scrollHeight;
}
async function act(id, kind) {
  try { const result = await api(`/residents/${encodeURIComponent(id)}/actions`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind})}); $('message').textContent = result.decision.reason; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
}
$('create').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { $('message').textContent = '请输入名字'; return; }
  try { const result = await api('/residents', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); $('message').textContent = `${result.resident.name} 已进场`; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
};
$('tick').onclick = async () => {
  $('tick').disabled = true;
  try { const result = await api('/world/tick', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); $('message').textContent = `${result.residents.length} 位居民完成了这一天`; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
  finally { $('tick').disabled = false; }
};
$('aiTick').onclick = async () => {
  $('aiTick').disabled = true;
  try { const result = await api('/world/ai-tick', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); $('message').textContent = `AI 回合完成，产生 ${result.events.length} 条事件`; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
  finally { $('aiTick').disabled = false; }
};
$('send').onclick = async () => {
  const resident = $('chatResident').value; const message = $('chatMessage').value.trim();
  if (!resident || !message) return;
  $('send').disabled = true;
  setPetState('thinking'); setCaption('正在想', 'Mori 正在整理想说的话…');
  try { await api(`/residents/${encodeURIComponent(resident)}/conversation`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})}); $('chatMessage').value = ''; await refresh(); setPetState('speaking', 1800); }
  catch (error) { $('message').textContent = error.message; setCaption('连接遇到问题', '这句话暂时没能送达，可以再试一次。'); setPetState('idle'); }
  finally { $('send').disabled = !aiConfigured || !$('chatResident').value; }
};
$('chatResident').onchange = () => loadConversation().catch(error => $('message').textContent = error.message);
$('chatMessage').onkeydown = event => { if (event.key === 'Enter') $('send').click(); };
$('petButton').onclick = () => { setPetState('greeting', 1100); $('chatMessage').focus(); };
$('chatMessage').onfocus = () => { if (!['thinking', 'greeting', 'speaking'].includes($('petButton').dataset.state)) setPetState('listening'); };
$('chatMessage').onblur = () => { if ($('petButton').dataset.state === 'listening') setPetState('idle'); };
function showAiStatus(status) {
  aiConfigured = status.configured;
  const source = status.key_source === 'local_config' ? '（本机配置）' : status.key_source === 'environment' ? '（环境变量）' : '';
  $('aiStatus').textContent = status.configured ? `AI 已连接：${status.model}${source}` : 'AI 未连接；输入密钥后可对话和 AI 推进';
  $('aiTick').disabled = !status.configured; $('send').disabled = !status.configured || !$('chatResident').value;
  $('startLife').disabled = !status.configured;
}
async function refreshLife() {
  const life = await api('/autonomy');
  const next = life.next_at ? new Date(life.next_at * 1000).toLocaleTimeString() : '未安排';
  $('lifeStatus').textContent = `${life.enabled ? '运行中' : '已暂停'} · 今天已调用 ${life.calls_today}/${life.max_calls_per_day} 次 · 下次 ${next}${life.in_flight ? ' · 正在决定' : ''}${life.last_error ? ' · 最近错误 ' + life.last_error : ''}`;
}
$('startLife').onclick = async () => {
  const resident_id = $('chatResident').value;
  if (!resident_id) { $('message').textContent = '先让角色进场'; return; }
  const interval_seconds = Number($('intervalMinutes').value) * 60;
  const max_calls_per_day = Number($('dailyLimit').value);
  try { await api('/autonomy', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:true,resident_id,interval_seconds,max_calls_per_day})}); $('message').textContent = '自主生活已开启'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
$('stopLife').onclick = async () => {
  try { await api('/autonomy', {method:'POST',headers:{'Content-Type':'application/json'},body:'{"enabled":false}'}); $('message').textContent = '已暂停自主生活'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
$('connect').onclick = async () => {
  const key = $('apiKey').value.trim(); if (!key) { $('message').textContent = '请输入 API Key'; return; }
  $('connect').disabled = true;
  try { showAiStatus(await api('/ai/connect', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key,remember:$('rememberKey').checked})})); $('apiKey').value = ''; $('message').textContent = $('rememberKey').checked ? 'DeepSeek 已连接，密钥已保存到本机配置' : 'DeepSeek 已连接'; }
  catch (error) { $('message').textContent = error.message; }
  finally { $('connect').disabled = false; }
};
$('disconnect').onclick = async () => {
  try { showAiStatus(await api('/ai/disconnect', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})); $('message').textContent = '本次服务已断开；重启时仍会读取已保存密钥'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
$('forgetKey').onclick = async () => {
  try { showAiStatus(await api('/ai/disconnect', {method:'POST',headers:{'Content-Type':'application/json'},body:'{"forget":true}'})); $('message').textContent = '已删除本机保存的密钥并断开'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
api('/ai/status').then(showAiStatus).catch(error => $('aiStatus').textContent = error.message);
$('refresh').onclick = () => refresh().catch(error => $('message').textContent = error.message);
refresh().catch(error => $('message').textContent = error.message);
refreshLife().catch(error => $('lifeStatus').textContent = error.message);
setInterval(() => refreshLife().catch(error => $('lifeStatus').textContent = error.message), 10000);
</script>
</html>
