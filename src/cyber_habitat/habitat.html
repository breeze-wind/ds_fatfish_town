<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Habitat · 本地世界</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6 }
  body { max-width: 880px; margin: 40px auto; padding: 0 20px }
  h1 { margin-bottom: 4px } .muted { color: #aab4c4 } .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
  input, button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #53627a }
  input { background: #1f2937; color: white } button { background: #2563eb; color: white; cursor: pointer }
  button:disabled { opacity: .5; cursor: wait } section { margin: 28px 0 } .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px }
  article { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 16px }
  article h3 { margin-top: 0 } .stat { margin: 7px 0 } .actions button { margin: 5px 5px 0 0; padding: 7px 10px }
  li { margin: 8px 0 } #message { min-height: 24px; color: #93c5fd }
  #chatLog { min-height: 80px; max-height: 280px; overflow: auto; background: #1f2937; border-radius: 8px; padding: 12px }
  #chatLog p { margin: 7px 0 } #chatMessage { flex: 1; min-width: 220px }
</style>
<h1>Cyber Habitat</h1>
<p class="muted">本地世界预览 · <span id="aiStatus">正在检查 AI 连接…</span></p>
<section><div class="row"><input id="apiKey" type="password" autocomplete="off" placeholder="在本机输入 DeepSeek API Key" aria-label="DeepSeek API Key"><label><input id="rememberKey" type="checkbox" checked> 保存到本机配置</label><button id="connect">连接 DeepSeek</button><button id="disconnect">本次断开</button><button id="forgetKey">删除本机保存的密钥</button></div><p class="muted">保存后密钥以明文写入本项目已忽略的 <code>.env</code>，服务重启会自动读取；它不会出现在 Git、页面状态或日志里。发送消息和 AI 推进时，相关内容会发给 DeepSeek。</p></section>
<section><div class="row"><input id="name" value="Mori" maxlength="80" aria-label="角色名字"><button id="create">让角色进场</button><button id="tick">规则推进一天</button><button id="aiTick" disabled>AI 推进一天</button><button id="refresh">刷新世界</button></div><p id="message" role="status"></p></section>
<section><h2>自主生活</h2><p class="muted">开启后，居民会定时自己决定动作。服务重启或断开模型时会自动暂停。</p><div class="row"><label>间隔（分钟） <input id="intervalMinutes" type="number" min="1" max="1440" value="30" style="width:75px"></label><label>每天最多 <input id="dailyLimit" type="number" min="1" max="48" value="24" style="width:65px"></label><button id="startLife" disabled>开启自主生活</button><button id="stopLife">暂停</button></div><p id="lifeStatus" class="muted">正在读取状态…</p></section>
<section><h2>居民</h2><div id="residents" class="cards"></div></section>
<section><h2>和居民说话</h2><div class="row"><select id="chatResident" aria-label="选择居民"></select><input id="chatMessage" maxlength="1000" placeholder="对居民说点什么"><button id="send" disabled>发送</button></div><div id="chatLog"></div></section>
<section><h2>最近事件</h2><ol id="events"></ol></section>
<script>
const $ = id => document.getElementById(id);
const labels = {'resident.created':'进入世界','action.applied':'完成动作','action.blocked':'动作被阻止','world.discovery':'发现','world.weather':'天气','world.visitor':'访客','world.tick':'规则回合结束','world.ai_tick':'AI 回合结束','ai.proposal.rejected':'AI 提议被拒绝','resident.spoke':'说话'};
const actions = {rest:'休息',learn:'学习',socialize:'社交',explore:'探索',create:'创作',attack:'攻击'};
async function api(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
  return data;
}
async function refresh() {
  const [people, history] = await Promise.all([api('/residents'), api('/events?limit=30')]);
  const selector = $('chatResident'); const selected = selector.value; selector.replaceChildren();
  for (const resident of people.residents) { const option = document.createElement('option'); option.value = resident.id; option.textContent = resident.name; selector.append(option); }
  if (people.residents.some(r => r.id === selected)) selector.value = selected;
  const cards = $('residents'); cards.replaceChildren();
  if (!people.residents.length) cards.textContent = '还没有居民。点击“让角色进场”。';
  for (const resident of people.residents) {
    const card = document.createElement('article');
    const title = document.createElement('h3'); title.textContent = resident.name; card.append(title);
    if (resident.intention) { const intention = document.createElement('p'); intention.className = 'muted'; intention.textContent = `现在想做：${resident.intention}`; card.append(intention); }
    for (const [label, key] of [['精力','energy'],['安全','safety'],['成长','growth']]) {
      const stat = document.createElement('div'); stat.className = 'stat'; stat.textContent = `${label}：${resident[key]}`; card.append(stat);
    }
    const actions = document.createElement('div'); actions.className = 'actions';
    for (const [label, kind] of [['休息','rest'],['学习','learn'],['社交','socialize'],['探索','explore'],['创作','create']]) {
      const button = document.createElement('button'); button.textContent = label;
      button.onclick = () => act(resident.id, kind); actions.append(button);
    }
    card.append(actions); cards.append(card);
  }
  const list = $('events'); list.replaceChildren();
  for (const event of history.events.reverse()) {
    const item = document.createElement('li');
    const detail = event.payload.description || event.payload.intention || (event.payload.action ? `${actions[event.payload.action] || event.payload.action}${event.payload.detail ? ' · ' + event.payload.detail : ''}` : '') || event.payload.name || event.payload.message || '';
    item.textContent = `${labels[event.type] || event.type} · ${event.subject}${detail ? ' · ' + detail : ''}`;
    list.append(item);
  }
  if (!history.events.length) list.textContent = '暂无事件。';
  await loadConversation();
}
async function loadConversation() {
  const log = $('chatLog'); log.replaceChildren();
  if (!$('chatResident').value) { log.textContent = '先让角色进场。'; return; }
  const data = await api(`/residents/${encodeURIComponent($('chatResident').value)}/conversation`);
  for (const entry of data.messages) { const line = document.createElement('p'); line.textContent = `${entry.role === 'user' ? '你' : '居民'}：${entry.content}`; log.append(line); }
  if (!data.messages.length) log.textContent = '还没有对话。';
  log.scrollTop = log.scrollHeight;
}
async function act(id, kind) {
  try { const result = await api(`/residents/${encodeURIComponent(id)}/actions`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind})}); $('message').textContent = result.decision.reason; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
}
$('create').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { $('message').textContent = '请输入名字'; return; }
  try { const result = await api('/residents', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); $('message').textContent = `${result.resident.name} 已进场`; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
};
$('tick').onclick = async () => {
  $('tick').disabled = true;
  try { const result = await api('/world/tick', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); $('message').textContent = `${result.residents.length} 位居民完成了这一天`; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
  finally { $('tick').disabled = false; }
};
$('aiTick').onclick = async () => {
  $('aiTick').disabled = true;
  try { const result = await api('/world/ai-tick', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); $('message').textContent = `AI 回合完成，产生 ${result.events.length} 条事件`; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
  finally { $('aiTick').disabled = false; }
};
$('send').onclick = async () => {
  const resident = $('chatResident').value; const message = $('chatMessage').value.trim();
  if (!resident || !message) return;
  $('send').disabled = true;
  try { await api(`/residents/${encodeURIComponent(resident)}/conversation`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})}); $('chatMessage').value = ''; await refresh(); }
  catch (error) { $('message').textContent = error.message; }
  finally { $('send').disabled = false; }
};
$('chatResident').onchange = () => loadConversation().catch(error => $('message').textContent = error.message);
$('chatMessage').onkeydown = event => { if (event.key === 'Enter') $('send').click(); };
function showAiStatus(status) {
  const source = status.key_source === 'local_config' ? '（本机配置）' : status.key_source === 'environment' ? '（环境变量）' : '';
  $('aiStatus').textContent = status.configured ? `AI 已连接：${status.model}${source}` : 'AI 未连接；输入密钥后可对话和 AI 推进';
  $('aiTick').disabled = !status.configured; $('send').disabled = !status.configured;
  $('startLife').disabled = !status.configured;
}
async function refreshLife() {
  const life = await api('/autonomy');
  const next = life.next_at ? new Date(life.next_at * 1000).toLocaleTimeString() : '未安排';
  $('lifeStatus').textContent = `${life.enabled ? '运行中' : '已暂停'} · 今天已调用 ${life.calls_today}/${life.max_calls_per_day} 次 · 下次 ${next}${life.in_flight ? ' · 正在决定' : ''}${life.last_error ? ' · 最近错误 ' + life.last_error : ''}`;
}
$('startLife').onclick = async () => {
  const resident_id = $('chatResident').value;
  if (!resident_id) { $('message').textContent = '先让角色进场'; return; }
  const interval_seconds = Number($('intervalMinutes').value) * 60;
  const max_calls_per_day = Number($('dailyLimit').value);
  try { await api('/autonomy', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:true,resident_id,interval_seconds,max_calls_per_day})}); $('message').textContent = '自主生活已开启'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
$('stopLife').onclick = async () => {
  try { await api('/autonomy', {method:'POST',headers:{'Content-Type':'application/json'},body:'{"enabled":false}'}); $('message').textContent = '已暂停自主生活'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
$('connect').onclick = async () => {
  const key = $('apiKey').value.trim(); if (!key) { $('message').textContent = '请输入 API Key'; return; }
  $('connect').disabled = true;
  try { showAiStatus(await api('/ai/connect', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key,remember:$('rememberKey').checked})})); $('apiKey').value = ''; $('message').textContent = $('rememberKey').checked ? 'DeepSeek 已连接，密钥已保存到本机配置' : 'DeepSeek 已连接'; }
  catch (error) { $('message').textContent = error.message; }
  finally { $('connect').disabled = false; }
};
$('disconnect').onclick = async () => {
  try { showAiStatus(await api('/ai/disconnect', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})); $('message').textContent = '本次服务已断开；重启时仍会读取已保存密钥'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
$('forgetKey').onclick = async () => {
  try { showAiStatus(await api('/ai/disconnect', {method:'POST',headers:{'Content-Type':'application/json'},body:'{"forget":true}'})); $('message').textContent = '已删除本机保存的密钥并断开'; await refreshLife(); }
  catch (error) { $('message').textContent = error.message; }
};
api('/ai/status').then(showAiStatus).catch(error => $('aiStatus').textContent = error.message);
$('refresh').onclick = () => refresh().catch(error => $('message').textContent = error.message);
refresh().catch(error => $('message').textContent = error.message);
refreshLife().catch(error => $('lifeStatus').textContent = error.message);
setInterval(() => refreshLife().catch(error => $('lifeStatus').textContent = error.message), 10000);
</script>
</html>
