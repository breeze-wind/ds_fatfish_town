[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-habitat"
version = "0.1.0"
description = "Local-first simulation core for a persistent digital world"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cyber-habitat = "cyber_habitat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
